apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tickit-ingress
  namespace: tickit-prod
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: app.tickit.local 
      http:
        paths:
          - path: /api/?(.*)
            pathType: Prefix
            backend:
              service:
                name: rails-api
                port:
                  number: 80
          - path: /(.*)
            pathType: Prefix
            backend:
              service:
                name: react-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - app.tickit.local
      secretName: tls-secret
